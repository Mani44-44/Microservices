apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ticketflow
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ticketflow-notification-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ticketflow-config
            - secretRef:
                name: notification-service-secret
          env:
            - name: POSTGRES_DB
              value: "ticketflow_notification"
            - name: SERVICE_NAME
              value: "notification-service"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ticketflow
spec:
  selector:
    app: notification-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
