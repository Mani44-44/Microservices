apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ticketflow
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ticketflow-gateway:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ticketflow-config
            - secretRef:
                name: gateway-secret
          env:
            - name: SERVICE_NAME
              value: "gateway"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ticketflow
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
