apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: ticketflow
  labels:
    app: rag-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      containers:
        - name: rag-service
          image: ticketflow-rag-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ticketflow-config
            - secretRef:
                name: rag-service-secret
          env:
            - name: POSTGRES_DB
              value: "ticketflow_rag"
            - name: SERVICE_NAME
              value: "rag-service"
            - name: POSTGRES_HOST
              value: "rag-postgres"
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: ticketflow
spec:
  selector:
    app: rag-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
