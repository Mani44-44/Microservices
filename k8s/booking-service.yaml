apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: ticketflow
  labels:
    app: booking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: ticketflow-booking-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ticketflow-config
            - secretRef:
                name: booking-service-secret
          env:
            - name: POSTGRES_DB
              value: "ticketflow_booking"
            - name: SERVICE_NAME
              value: "booking-service"
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: ticketflow
spec:
  selector:
    app: booking-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
